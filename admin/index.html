<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Admin - Dashboard</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">Arcane Admin</div>
        <nav class="sidebar-nav">
            <a href="index.html" class="active">Dashboard</a>
            <a href="content.html">Content</a>
            <a href="events.html">Events</a>
            <a href="media.html">Media</a>
            <a href="services.html">Services</a>
            <a href="bookings.html">Bookings</a>
            <a href="blog.html">Blog</a>
            <a href="settings.html">Settings</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Dashboard</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="stat-events">0</h3>
                <p>Total Events</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-media">0</h3>
                <p>Media Items</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-enquiries">0</h3>
                <p>New Enquiries</p>
            </div>
        </div>
    </div>

    <script src="./assets/js/supabase-client.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script>
        // Protect the page
        checkAuth();

        // Fetch Dashboard Stats
        async function loadStats() {
            // Count Events
            const { count: eventCount } = await supabaseClient
                .from('events')
                .select('*', { count: 'exact', head: true });
            document.getElementById('stat-events').innerText = eventCount || 0;

            // Count Media
            const { count: mediaCount } = await supabaseClient
                .from('media_items')
                .select('*', { count: 'exact', head: true });
            document.getElementById('stat-media').innerText = mediaCount || 0;

            // Count New Enquiries
            const { count: enquiryCount } = await supabaseClient
                .from('enquiries')
                .select('*', { count: 'exact', head: true })
                .eq('status', 'new');
            document.getElementById('stat-enquiries').innerText = enquiryCount || 0;
        }

        loadStats();
    </script>
</body>
</html>
